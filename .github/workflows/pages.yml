# Builds the Jekyll site and deploys it to GitHub Pages.
# Runs on every push to main, every 3 hours (to refresh the Waffle House temperatures),
# and on demand from the Actions tab.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Build and deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Scheduled/manual runs ask Open-Meteo; pushes reuse the temperatures already published.
      - name: Fetch Waffle House temperatures
        continue-on-error: true
        run: node tools/fetch-waffle-temps.mjs ${{ github.event_name == 'push' && '--prefer-live' || '' }}

      - uses: actions/configure-pages@v5

      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
