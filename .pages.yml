# Pages CMS (app.pagescms.org): a web editor for the blog.
# Saving a post commits it to this repo, and GitHub Actions republishes the site.
media:
  input: assets/img
  output: /assets/img

content:
  - name: posts
    label: Blog posts
    type: collection
    path: _posts
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create
    format: yaml-frontmatter
    view:
      fields: [title, date, published]
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
      - name: published
        label: Published (off = draft, not on the site)
        type: boolean
        default: false
      - name: description
        label: Summary (shows on the blog list and the homepage)
        type: text
      - name: kicker
        label: Kicker (small pink line above the title)
        type: string
      - name: tags
        label: Tags
        type: string
        list: true
      - name: body
        label: Post
        type: rich-text
