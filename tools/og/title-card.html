<!doctype html>
<!-- Default share card for any post without its own card or `image:`. tools/og/auto.py calls fill(). -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="card.css">
<style>
  .card { display: flex; flex-direction: column; padding-bottom: 64px; }
  #contours { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .55; }
  #contours path { fill: none; stroke-linejoin: round; stroke-linecap: round; }
  .brand, .text { position: relative; }
  .brand { position: relative; right: auto; top: auto; }
  .body { flex: 1; display: flex; align-items: center; }
  /* A soft paper wash behind the words, like the homepage hero, so the title stays readable */
  .text {
    width: fit-content; max-width: 1000px; padding: 22px 30px 26px; margin-left: -30px; border-radius: 6px;
    background: color-mix(in srgb, var(--paper) 86%, transparent);
  }
  #title { font-size: 84px; line-height: 1.03; max-width: none; }
</style>
</head>
<body>
<div class="card">
  <svg id="contours" viewBox="0 0 1200 760" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
  <div class="brand"></div>
  <div class="body">
    <div class="text">
      <p class="kicker" id="kicker"></p>
      <h1 id="title">Post title</h1>
    </div>
  </div>
</div>
<script src="card.js"></script>
<script src="contours.js"></script>
<script>
  // Called by auto.py: draw this post's terrain, set the text, shrink the title until it fits in 4 lines.
  window.fill = (title, kicker, slug) => {
    const svg = document.getElementById('contours');
    svg.textContent = '';
    contours(svg, seedFrom(slug || title));
    const h = document.getElementById('title'), k = document.getElementById('kicker');
    h.textContent = title;
    k.textContent = kicker || '';
    k.hidden = !kicker;
    let size = 84;
    h.style.fontSize = size + 'px';
    const lines = () => Math.round(h.getBoundingClientRect().height / (size * 1.03));
    while (lines() > 4 && size > 44) { size -= 2; h.style.fontSize = size + 'px'; }
    return { size, lines: lines() };
  };
</script>
</body>
</html>
